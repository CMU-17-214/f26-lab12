name: CI

on: [push, pull_request]        # 什么时候触发：push 和 PR

jobs:
  test:                         # 一个 job，名字叫 test
    runs-on: ubuntu-latest      # 在 GitHub 提供的 Ubuntu 机器上跑
    steps:
      - uses: actions/checkout@v4          # 1. 把你的代码拉下来
      - uses: actions/setup-python@v5      # 2. 安装 Python
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt   # 3. 安装依赖
      - run: pytest                                # 4. 跑测试