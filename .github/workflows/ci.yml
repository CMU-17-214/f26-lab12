name: CI

# Run on every push and every pull request.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Get the repo's code onto the runner.
      - uses: actions/checkout@v4

      # 2. Install Python (3.11 is the minimum in pyproject.toml).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. Install the pinned dev tools (pytest, ruff, mypy, pip-audit).
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # 4. Run the test suite. A failing test fails the run.
      - name: Run tests
        run: pytest

  # The gate: three static checks, each in its own job so one failure
  # does not hide the others.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Linter: catches likely bugs in the code (rules set in pyproject.toml).
      - name: ruff
        run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Type checker: catches values of the wrong type (settings in pyproject.toml).
      - name: mypy
        run: mypy

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Dependency audit: checks runtime packages against known vulnerabilities.
      # babel 2.9.0 was flagged (PYSEC-2021-421, code execution). Nothing in the
      # service imports babel, so we removed it instead of upgrading or ignoring.
      - name: pip-audit
        run: pip-audit -r requirements.txt
